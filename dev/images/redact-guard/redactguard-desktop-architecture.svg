<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="32" fill="#07111F"/>
  <defs>
    <linearGradient id="accent" x1="160" y1="160" x2="1040" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <text x="72" y="76" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">REDACTGUARD · DESKTOP</text>
  <text x="72" y="120" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Who owns what</text>
  <text x="72" y="154" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="18">Product workflow stays in RedactGuard. Local execution stays behind Korgis.</text>

  <rect x="72" y="218" width="320" height="326" rx="24" fill="#0F1B2D" stroke="#334155" stroke-width="2"/>
  <rect x="92" y="238" width="104" height="30" rx="15" fill="#172554"/>
  <text x="111" y="259" fill="#93C5FD" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">PRODUCT</text>
  <text x="96" y="314" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">RedactGuard Desktop</text>
  <text x="96" y="351" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="16">Document workflow</text>
  <text x="96" y="384" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Import &amp; parsing</text>
  <text x="96" y="416" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">PII policy</text>
  <text x="96" y="448" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Human review</text>
  <text x="96" y="480" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Redaction &amp; export</text>
  <text x="96" y="519" fill="#5EEAD4" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">OWNS THE USER PROBLEM</text>

  <path d="M414 380H474" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M462 369L476 380L462 391" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="419" y="358" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">CALL</text>

  <rect x="494" y="264" width="278" height="234" rx="24" fill="#0B2340" stroke="#2563EB" stroke-width="2"/>
  <circle cx="633" cy="321" r="35" fill="#1D4ED8" opacity="0.22" filter="url(#glow)"/>
  <circle cx="633" cy="321" r="22" fill="#2563EB"/>
  <path d="M623 321H643M633 311V331" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <text x="547" y="377" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750">Korgis</text>
  <text x="542" y="410" fill="#93C5FD" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">LOCAL AI EXECUTION LAYER</text>
  <text x="535" y="449" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="16">Reusable runtime boundary</text>
  <text x="548" y="475" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="16">for desktop workloads</text>

  <path d="M792 380H852" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M840 369L854 380L840 391" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="798" y="358" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">EXECUTE</text>

  <rect x="872" y="218" width="256" height="326" rx="24" fill="#0D292B" stroke="#0F766E" stroke-width="2"/>
  <rect x="892" y="238" width="102" height="30" rx="15" fill="#134E4A"/>
  <text x="913" y="259" fill="#99F6E4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">RUNTIME</text>
  <text x="896" y="314" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Local model</text>
  <text x="896" y="350" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="16">Inference on controlled</text>
  <text x="896" y="374" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="16">desktop infrastructure</text>
  <rect x="896" y="411" width="208" height="48" rx="12" fill="#0F172A" stroke="#334155"/>
  <text x="923" y="442" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">llama.cpp / GGUF</text>
  <rect x="896" y="473" width="208" height="48" rx="12" fill="#0F172A" stroke="#334155"/>
  <text x="930" y="504" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="16">Local hardware</text>

  <rect x="72" y="606" width="1056" height="90" rx="20" fill="#0F172A" stroke="#1E293B"/>
  <circle cx="108" cy="651" r="8" fill="#14B8A6"/>
  <text x="132" y="644" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Desktop proof</text>
  <text x="132" y="672" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="16">The privacy workflow and the local execution backbone evolve independently, while inference remains inside infrastructure the user controls.</text>
</svg>
