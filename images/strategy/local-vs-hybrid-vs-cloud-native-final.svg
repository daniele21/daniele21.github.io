<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 806 900"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Local vs Hybrid vs Cloud</title>
  <desc id="desc">Native vector infographic comparing Local, Hybrid and Cloud AI deployment boundaries.</desc>

  <defs>
    <style>
      .ui { font-family: Inter, Arial, sans-serif; }
      .blue { fill:#1664FF; }
      .navy { fill:#0E1838; }
      .muted { fill:#586987; }
      .stroke-blue { stroke:#1664FF; }
      .stroke-soft { stroke:#DCE6F6; }
      .stroke-device { stroke:#8FB0FF; }
      .chip { fill:#F1F4FA; }
      .pill-text { font-size:30px; font-weight:700; }
      .node-text { font-size:26px; font-weight:650; }
      .caption { font-size:21px; font-weight:500; }
      .guide { font-size:23px; font-weight:650; }
      .footer { font-size:21px; font-weight:500; }
    </style>
  </defs>

  <!-- column labels -->
  <g class="ui">
    <rect x="37" y="2" width="149" height="68" rx="18" fill="none" class="stroke-soft" stroke-width="2"/>
    <text x="111.5" y="47" text-anchor="middle" class="blue pill-text">Local</text>

    <rect x="313" y="2" width="158" height="68" rx="18" fill="none" class="stroke-soft" stroke-width="2"/>
    <text x="392" y="47" text-anchor="middle" class="blue pill-text">Hybrid</text>

    <rect x="596" y="2" width="149" height="68" rx="18" fill="none" class="stroke-soft" stroke-width="2"/>
    <text x="670.5" y="47" text-anchor="middle" class="blue pill-text">Cloud</text>
  </g>

  <!-- separators -->
  <line x1="245" y1="0" x2="245" y2="610" class="stroke-soft" stroke-width="2"/>
  <line x1="525" y1="0" x2="525" y2="610" class="stroke-soft" stroke-width="2"/>

  <!-- LOCAL -->
  <g class="ui">
    <rect x="15" y="116" width="190" height="401" rx="29"
          fill="none" class="stroke-device" stroke-width="2.5"/>
    <line x1="93" y1="502" x2="128" y2="502" stroke="#C9D8F1" stroke-width="4" stroke-linecap="round"/>

    <rect x="40" y="151" width="140" height="60" rx="14" class="chip"/>
    <text x="110" y="190" text-anchor="middle" class="navy node-text">Data</text>

    <path d="M110 228 V259" fill="none" class="stroke-blue" stroke-width="3" stroke-linecap="round"/>
    <path d="M102 251 L110 259 L118 251" fill="none" class="stroke-blue" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="40" y="276" width="140" height="60" rx="14" class="chip"/>
    <text x="110" y="315" text-anchor="middle" class="navy node-text">Model</text>

    <path d="M110 353 V384" fill="none" class="stroke-blue" stroke-width="3" stroke-linecap="round"/>
    <path d="M102 376 L110 384 L118 376" fill="none" class="stroke-blue" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="40" y="401" width="140" height="60" rx="14" class="chip"/>
    <text x="110" y="440" text-anchor="middle" class="navy node-text">Result</text>

    <text x="110" y="596" text-anchor="middle" class="muted caption">Maximum control</text>
  </g>

  <!-- HYBRID -->
  <g class="ui">
    <rect x="290" y="116" width="177" height="199" rx="29"
          fill="none" class="stroke-device" stroke-width="2.5"/>
    <line x1="361" y1="300" x2="396" y2="300" stroke="#C9D8F1" stroke-width="4" stroke-linecap="round"/>

    <!-- lock -->
    <g transform="translate(370 132)">
      <rect x="0" y="10" width="18" height="22" rx="3.5" fill="#1664FF"/>
      <path d="M4.2 10 V5.5 C4.2 1.8 6.2 0 9 0 C11.8 0 13.8 1.8 13.8 5.5 V10"
            fill="none" stroke="#1664FF" stroke-width="3.2" stroke-linecap="round"/>
    </g>

    <rect x="314" y="174" width="129" height="95" rx="14" class="chip"/>
    <text x="378.5" y="211" text-anchor="middle" class="navy node-text">
      <tspan x="378.5" dy="0">Private</tspan>
      <tspan x="378.5" dy="34">data</tspan>
    </text>

    <path d="M378.5 334 V371" fill="none" class="stroke-blue" stroke-width="3" stroke-linecap="round"/>
    <path d="M370.5 363 L378.5 371 L386.5 363" fill="none" class="stroke-blue" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- compact reasoning cloud -->
    <path d="
      M304 526
      C283 526 267 510 267 490
      C267 471 281 455 300 452
      C303 430 321 414 343 414
      C351 393 370 381 392 381
      C422 381 446 402 451 430
      C459 424 469 421 479 421
      C504 421 524 441 524 466
      C524 492 504 512 478 512
      C472 521 462 526 450 526
      H304
      Z"
      fill="none" class="stroke-blue" stroke-width="2.5"/>
    <text x="396" y="489" text-anchor="middle" class="navy node-text">Reasoning</text>

    <text x="392" y="596" text-anchor="middle" class="muted caption">Selective boundary</text>
  </g>

  <!-- CLOUD -->
  <g class="ui">
    <rect x="626" y="120" width="70" height="104" rx="17"
          fill="none" class="stroke-device" stroke-width="2.5"/>
    <line x1="646" y1="211" x2="676" y2="211" stroke="#C9D8F1" stroke-width="4" stroke-linecap="round"/>

    <path d="M661 242 V274" fill="none" class="stroke-blue" stroke-width="3" stroke-linecap="round"/>
    <path d="M653 266 L661 274 L669 266" fill="none" class="stroke-blue" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- cloud kept fully inside viewBox -->
    <path d="
      M564 523
      C540 523 522 505 522 482
      C522 460 538 442 559 439
      C562 411 583 390 611 388
      C619 351 648 326 684 326
      C725 326 756 356 763 396
      C772 389 783 386 793 386
      C801 386 806 388 806 388
      V474
      C802 478 797 481 791 482
      C784 507 764 523 739 523
      H564
      Z"
      fill="none" class="stroke-blue" stroke-width="2.5"/>
    <rect x="603" y="382" width="118" height="48" rx="12" class="chip"/>
    <text x="662" y="414" text-anchor="middle" class="navy node-text">Data</text>

    <rect x="603" y="438" width="118" height="48" rx="12" class="chip"/>
    <text x="662" y="470" text-anchor="middle" class="navy node-text">Model</text>

    <rect x="603" y="494" width="118" height="48" rx="12" class="chip"/>
    <text x="662" y="526" text-anchor="middle" class="navy node-text">Compute</text>

    <text x="678" y="596" text-anchor="middle" class="muted caption">Maximum capability</text>
  </g>

  <!-- lower divider -->
  <line x1="20" y1="674" x2="786" y2="674" class="stroke-soft" stroke-width="2"/>

  <!-- Control -> Capability -->
  <g class="ui">
    <text x="19" y="749" class="blue guide">Control</text>
    <line x1="128" y1="739" x2="655" y2="739"
          class="stroke-blue" stroke-width="2.5"
          stroke-dasharray="4 7" stroke-linecap="round"/>
    <circle cx="252" cy="739" r="9" fill="#1664FF"/>
    <path d="M646 731 L655 739 L646 747"
          fill="none" class="stroke-blue" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="786" y="749" text-anchor="end" class="blue guide">Capability</text>

    <text x="20" y="840" class="muted footer">Same workload. Three deployment boundaries.</text>
  </g>
</svg>