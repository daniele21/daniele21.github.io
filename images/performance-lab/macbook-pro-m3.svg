<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" role="img" aria-labelledby="title desc">
  <title id="title">MacBook Pro M3</title>
  <desc id="desc">Stylized front view of a MacBook Pro M3 used as a Performance Lab device thumbnail.</desc>
  <defs>
    <linearGradient id="mbp-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060913"/>
      <stop offset="0.45" stop-color="#0e172a"/>
      <stop offset="0.8" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#24344d"/>
    </linearGradient>
    <linearGradient id="mbp-glow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="mbp-lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38414e"/>
      <stop offset="0.5" stop-color="#222832"/>
      <stop offset="1" stop-color="#181d24"/>
    </linearGradient>
    <linearGradient id="mbp-base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#232933"/>
      <stop offset="0.5" stop-color="#343c49"/>
      <stop offset="1" stop-color="#1f252e"/>
    </linearGradient>
    <linearGradient id="mbp-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5565"/>
      <stop offset="1" stop-color="#1c2129"/>
    </linearGradient>
    <filter id="mbp-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0a0f1d" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#mbp-shadow)">
    <!-- Screen Lid Outer (Space Black anodized aluminum) -->
    <rect x="30" y="11" width="120" height="78" rx="6.5" fill="url(#mbp-lid)"/>

    <!-- Screen Bezel (Liquid Retina XDR slim border) -->
    <rect x="32.5" y="13.5" width="115" height="73" rx="4.5" fill="#07090e"/>

    <!-- Screen Panel -->
    <rect x="35" y="16" width="110" height="68" rx="2.5" fill="url(#mbp-screen)"/>

    <!-- M3 Wallpaper Fluid Waves -->
    <path d="M 35 68 Q 62 42 88 56 T 145 38 L 145 84 L 35 84 Z" fill="url(#mbp-glow)"/>
    <path d="M 45 84 Q 78 50 110 65 T 145 52" fill="none" stroke="#60a5fa" stroke-width="1.2" opacity="0.65"/>
    <path d="M 35 78 Q 72 62 105 72 T 145 64" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>

    <!-- Display Camera Notch -->
    <path d="M 83 16 H 97 A 2.5 2.5 0 0 1 99.5 18.5 V 20 H 80.5 V 18.5 A 2.5 2.5 0 0 1 83 16 Z" fill="#07090e"/>
    <circle cx="90" cy="18" r="0.8" fill="#1e293b"/>

    <!-- Hinge / Lower border of display -->
    <rect x="35" y="83" width="110" height="3" fill="#13171e"/>

    <!-- Base Chassis (MacBook Pro sturdy squared profile) -->
    <path d="M 12 91 L 168 91 L 160 102 L 20 102 Z" fill="url(#mbp-base)"/>
    <path d="M 12 91 L 168 91 L 167 92.5 L 13 92.5 Z" fill="url(#mbp-edge)"/>

    <!-- Front Opening Lip (Center Thumb Notch) -->
    <path d="M 68 91 H 112 C 112 94.5 109 96.5 105 96.5 H 75 C 71 96.5 68 94.5 68 91 Z" fill="#181d24"/>

    <!-- Bottom Foot Pads / Base Shadow Line -->
    <rect x="26" y="101.5" width="12" height="1.5" rx="0.75" fill="#0f1318"/>
    <rect x="142" y="101.5" width="12" height="1.5" rx="0.75" fill="#0f1318"/>
    <path d="M 24 102 H 156" stroke="#12161d" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
