<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="cs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="cs-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
  </defs>
  <!-- Main Container / Window -->
  <rect width="1200" height="750" rx="16" fill="url(#cs-bg)" />
  
  <!-- Window Header -->
  <rect width="1200" height="48" rx="16" fill="#1E293B" />
  <rect y="32" width="1200" height="16" fill="#1E293B" />
  <circle cx="24" cy="24" r="6" fill="#EF4444" />
  <circle cx="44" cy="24" r="6" fill="#F59E0B" />
  <circle cx="64" cy="24" r="6" fill="#10B981" />
  <text x="100" y="29" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Local LLM Studio — Chat Studio (/v1/chat/completions)</text>
  <rect x="1000" y="12" width="176" height="24" rx="12" fill="#334155" />
  <text x="1016" y="28" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="600">● 127.0.0.1:1235</text>

  <!-- Sidebar -->
  <rect x="0" y="48" width="260" height="702" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="20" y="80" fill="#64748B" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">MODELS &amp; RUNTIME</text>
  
  <!-- Active Model Item -->
  <rect x="14" y="96" width="232" height="64" rx="8" fill="#1E293B" stroke="#2563EB" stroke-width="2" />
  <text x="28" y="122" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="700">nemotron-nano-4b</text>
  <text x="28" y="142" fill="#38BDF8" font-family="monospace" font-size="12">GGUF Q8_0 · Resident</text>
  <circle cx="220" cy="128" r="5" fill="#10B981" />

  <!-- Inactive Model Item -->
  <rect x="14" y="170" width="232" height="64" rx="8" fill="#1E293B" opacity="0.6" />
  <text x="28" y="196" fill="#94A3B8" font-family="sans-serif" font-size="14" font-weight="600">qwen2.5-coder-7b</text>
  <text x="28" y="216" fill="#64748B" font-family="monospace" font-size="12">MLX 4-bit · Standby</text>

  <!-- Settings Panel in Sidebar -->
  <text x="20" y="270" fill="#64748B" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">INFERENCE PARAMS</text>
  <text x="20" y="300" fill="#CBD5E1" font-family="sans-serif" font-size="13">Temperature: 0.2</text>
  <rect x="20" y="312" width="220" height="6" rx="3" fill="#334155" />
  <rect x="20" y="312" width="60" height="6" rx="3" fill="#2563EB" />
  
  <text x="20" y="345" fill="#CBD5E1" font-family="sans-serif" font-size="13">Max Tokens: 2048</text>
  <text x="20" y="380" fill="#CBD5E1" font-family="sans-serif" font-size="13">Top P: 0.95</text>
  <text x="20" y="415" fill="#CBD5E1" font-family="sans-serif" font-size="13">Stream Response: True</text>

  <!-- Main Chat Area -->
  <rect x="260" y="48" width="940" height="702" fill="#020617" />
  
  <!-- System / User Prompt Bubble -->
  <rect x="290" y="80" width="880" height="90" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <text x="310" y="106" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="700">USER PROMPT</text>
  <text x="310" y="132" fill="#F8FAFC" font-family="sans-serif" font-size="14">Extract structured action items and security bounds from the meeting notes in JSON format.</text>

  <!-- Assistant Streamed Response Bubble -->
  <rect x="290" y="190" width="880" height="420" rx="12" fill="#0F172A" stroke="#2563EB" stroke-width="1.5" />
  <text x="310" y="216" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">ASSISTANT RESPONSE (STREAMING · 64.2 tok/s)</text>
  
  <rect x="310" y="235" width="840" height="355" rx="8" fill="#020617" />
  <text x="330" y="265" fill="#A7F3D0" font-family="monospace" font-size="13">{</text>
  <text x="350" y="290" fill="#93C5FD" font-family="monospace" font-size="13">"decisions": [</text>
  <text x="370" y="315" fill="#FDE047" font-family="monospace" font-size="13">"Enforce loopback interface binding by default (127.0.0.1)",</text>
  <text x="370" y="340" fill="#FDE047" font-family="monospace" font-size="13">"Keep administrative API endpoints opt-in via flag"</text>
  <text x="350" y="365" fill="#93C5FD" font-family="monospace" font-size="13">],</text>
  <text x="350" y="390" fill="#93C5FD" font-family="monospace" font-size="13">"action_items": [</text>
  <text x="370" y="415" fill="#F7768E" font-family="monospace" font-size="13">{ "owner": "Daniele", "task": "Add GGUF lease drain safety checks", "due": "Q3" }</text>
  <text x="350" y="440" fill="#93C5FD" font-family="monospace" font-size="13">],</text>
  <text x="350" y="465" fill="#93C5FD" font-family="monospace" font-size="13">"runtime_metrics": { "prompt_eval_ms": 42.1, "eval_tok_per_sec": 64.2 }</text>
  <text x="330" y="490" fill="#A7F3D0" font-family="monospace" font-size="13">}</text>
  <rect x="345" y="480" width="8" height="14" fill="#38BDF8" />

  <!-- Input Bar at Bottom -->
  <rect x="290" y="630" width="880" height="54" rx="27" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="320" y="662" fill="#64748B" font-family="sans-serif" font-size="14">Send prompt to resident model...</text>
  <circle cx="1140" cy="657" r="18" fill="url(#cs-accent)" />
  <path d="M1134 657 L1146 657 M1140 651 L1146 657 L1140 663" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
