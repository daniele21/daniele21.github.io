<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="layer-api" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="layer-mgr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="layer-eng" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1000" height="600" rx="16" fill="url(#arch-bg)" />
  
  <!-- Header Title -->
  <text x="40" y="45" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700">Local LLM Server Architecture &amp; Runtime Boundary</text>
  <text x="40" y="68" fill="#94A3B8" font-family="sans-serif" font-size="13">Decoupling application requests from local inference backend execution and model file lifecycle.</text>

  <!-- Section 1: Client Applications -->
  <g transform="translate(40, 100)">
    <rect width="920" height="70" rx="12" fill="#020617" stroke="#334155" stroke-width="1" filter="url(#glow)" />
    <text x="24" y="32" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">CLIENT LAYER (HTTP / REST)</text>
    
    <rect x="220" y="16" width="180" height="38" rx="6" fill="#1E293B" />
    <text x="235" y="40" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="600">ClosedRoom Desktop</text>

    <rect x="420" y="16" width="180" height="38" rx="6" fill="#1E293B" />
    <text x="440" y="40" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="600">Python / TS Client</text>

    <rect x="620" y="16" width="180" height="38" rx="6" fill="#1E293B" />
    <text x="632" y="40" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="600">Local LLM Studio Web UI</text>
  </g>

  <!-- Arrow Down 1 -->
  <path d="M500 170 V195" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="500,202 494,192 506,192" fill="#38BDF8" />

  <!-- Section 2: Public API Boundary -->
  <g transform="translate(40, 205)">
    <rect width="920" height="85" rx="12" fill="url(#layer-api)" stroke="#3B82F6" stroke-width="1.5" filter="url(#glow)" />
    <text x="24" y="28" fill="#93C5FD" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">FASTAPI PUBLIC BOUNDARY &amp; ROUTING</text>
    
    <rect x="24" y="40" width="270" height="34" rx="6" fill="#1E3A8A" />
    <text x="36" y="62" fill="#FFFFFF" font-family="monospace" font-size="12">POST /v1/chat/completions</text>

    <rect x="310" y="40" width="180" height="34" rx="6" fill="#1E3A8A" />
    <text x="325" y="62" fill="#FFFFFF" font-family="monospace" font-size="12">GET /v1/models</text>

    <rect x="500" y="40" width="220" height="34" rx="6" fill="#1E3A8A" />
    <text x="512" y="62" fill="#FFFFFF" font-family="monospace" font-size="12">GET /health &amp; telemetry</text>

    <rect x="735" y="40" width="160" height="34" rx="6" fill="#4C1D95" />
    <text x="747" y="62" fill="#E9D5FF" font-family="monospace" font-size="12">/admin/* (opt-in)</text>
  </g>

  <!-- Arrow Down 2 -->
  <path d="M500 290 V315" stroke="#10B981" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="500,322 494,312 506,312" fill="#10B981" />

  <!-- Section 3: ModelRuntimeManager -->
  <g transform="translate(40, 325)">
    <rect width="920" height="100" rx="12" fill="url(#layer-mgr)" stroke="#10B981" stroke-width="1.5" filter="url(#glow)" />
    <text x="24" y="28" fill="#A7F3D0" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">MODEL RUNTIME MANAGER (LIFECYCLE, LEASES &amp; CONCURRENCY)</text>
    
    <rect x="24" y="42" width="270" height="42" rx="6" fill="#064E3B" />
    <text x="36" y="67" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Registry &amp; Artifact Resolver</text>

    <rect x="310" y="42" width="280" height="42" rx="6" fill="#064E3B" />
    <text x="325" y="67" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Resident Lease &amp; Drain Safety</text>

    <rect x="605" y="42" width="290" height="42" rx="6" fill="#064E3B" />
    <text x="620" y="67" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Admission &amp; Stream Collector</text>
  </g>

  <!-- Arrows Split -->
  <path d="M260 425 V450" stroke="#A855F7" stroke-width="2" />
  <polygon points="260,457 254,447 266,447" fill="#A855F7" />

  <path d="M740 425 V450" stroke="#A855F7" stroke-width="2" />
  <polygon points="740,457 734,447 746,447" fill="#A855F7" />

  <!-- Section 4: Engine Backends -->
  <g transform="translate(40, 460)">
    <rect width="440" height="100" rx="12" fill="url(#layer-eng)" stroke="#A855F7" stroke-width="1.5" filter="url(#glow)" />
    <text x="20" y="28" fill="#E9D5FF" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">GGUF ENGINE BACKENDS</text>
    <rect x="20" y="42" width="190" height="40" rx="6" fill="#4C1D95" />
    <text x="32" y="66" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">llama_cpp (In-Process)</text>
    <rect x="225" y="42" width="195" height="40" rx="6" fill="#4C1D95" />
    <text x="237" y="66" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">llama_server (Process)</text>
  </g>

  <g transform="translate(520, 460)">
    <rect width="440" height="100" rx="12" fill="url(#layer-eng)" stroke="#A855F7" stroke-width="1.5" filter="url(#glow)" />
    <text x="20" y="28" fill="#E9D5FF" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">APPLE SILICON MLX ENGINE BACKENDS</text>
    <rect x="20" y="42" width="190" height="40" rx="6" fill="#4C1D95" />
    <text x="35" y="66" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">mlx (Metal In-Process)</text>
    <rect x="225" y="42" width="195" height="40" rx="6" fill="#4C1D95" />
    <text x="235" y="66" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">mlx_vlm_server (Process)</text>
  </g>
</svg>
